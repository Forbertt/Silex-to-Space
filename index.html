<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Silex To Space</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="carte">
    <h1 class="titre">Silex <span>to</span> Space</h1>
    <p class="sous-titre">Du premier éclat de pierre à la conquête des étoiles</p>

    <!-- Généré par ui.js -->
    <div class="scores" id="scores"></div>
    <nav class="onglets" id="onglets" hidden></nav>
    <!-- Les zones de clic (zone-silex, zone-bronze...) sont insérées ici par ui.js -->

    <section id="boutique" hidden>
      <h2>Évolutions</h2>
      <div id="liste-evolutions"></div>

      <h2 id="titre-technologies" hidden>Technologies</h2>
      <div id="liste-technologies"></div>
    </section>

    <div class="pied">
      <button id="ouvrir-codex" class="bouton-codex">📖 Codex</button>
      <button id="ouvrir-succes" class="bouton-codex">🏆 Succès</button>
      <button id="reset" class="reset">Réinitialiser la partie</button>
      <button id="ouvrir-monuments" class="bouton-codex" hidden>🏛️ Monuments</button>
    </div>
  </main>

  <dialog id="decouverte">
    <p class="etiquette">Nouvelle découverte</p>
    <img id="decouverte-image" alt="" hidden>
    <h2 id="decouverte-titre"></h2>
    <p id="decouverte-texte"></p>
    <p id="decouverte-bonus" class="bonus" hidden></p>
    <p class="source">Source : Wikipédia (licence CC BY-SA)</p>
    <a id="decouverte-lien" href="#" target="_blank" rel="noopener noreferrer">
      Lire l'article sur Wikipédia
    </a>
    <button id="decouverte-fermer">Continuer à jouer</button>
  </dialog>

  <dialog id="codex">
    <div class="codex-corps">
      <div class="codex-entete">
        <h2>Codex</h2>
        <button id="codex-fermer" class="codex-fermer" aria-label="Fermer">✕</button>
      </div>
      <p id="codex-progression" class="codex-progression"></p>
      <div class="codex-barre"><div id="codex-barre-remplie"></div></div>
      <div id="codex-contenu"></div>
    </div>
  </dialog>

  <dialog id="succes">
    <div class="codex-corps">
      <div class="codex-entete">
        <h2>Succès</h2>
        <button id="succes-fermer" class="codex-fermer" aria-label="Fermer">✕</button>
      </div>
      <p id="succes-progression" class="codex-progression"></p>
      <div class="codex-barre"><div id="succes-barre-remplie"></div></div>
      <p id="succes-bonus" class="succes-bonus"></p>
      <div id="succes-contenu"></div>
    </div>
  </dialog>

  <dialog id="monuments">
    <div class="codex-corps">
      <div class="codex-entete">
        <h2>🏛️ Monuments</h2>
        <button id="monuments-fermer" class="codex-fermer" aria-label="Fermer">✕</button>
      </div>
      <p id="monuments-progression" class="codex-progression"></p>
      <div id="monuments-contenu" class="monuments-liste"></div>
    </div>
  </dialog>

  <script src="donnees.js"></script>
  <script src="ui.js"></script>
  <script src="game.js"></script>
  <script src="codex.js"></script>
  <script src="succes.js"></script>
  <script src="monuments.js"></script>
  <script src="comete.js"></script>
</body>
</html>
